[package]
name = "superapp-wasm-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
superapp-core = { path = "../core" }
superapp-package = { path = "../package" }
superapp-ui = { path = "../ui" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["time"] }
# Só o que usamos: Cranelift + Component Model + async. Sem cache em disco, GC, depuração,
# perfil, coredump, threads nem parser WIT (reduz bastante o binário).
wasmtime = { version = "50", default-features = false, features = ["std", "anyhow", "async", "backtrace", "cranelift", "runtime", "component-model", "parallel-compilation"] }
wasmtime-wasi = "50"

[dev-dependencies]
ed25519-dalek = "2"
tokio = { version = "1", features = ["rt", "macros", "time"] }
