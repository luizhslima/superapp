[package]
name = "discovery"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
superapp-sdk = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Projeto independente: não faz parte do workspace do repositório.
[workspace]
