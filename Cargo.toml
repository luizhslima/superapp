[workspace]
resolver = "2"
members = ["crates/*", "xtask", "src-tauri"]
# Spikes são descartáveis e independentes (cada um com seu próprio Cargo.toml/target).
exclude = ["spikes"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release enxuto: LTO e símbolos removidos (o instalador é distribuído sem assinatura, tamanho importa).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Testes e smoke compilam componentes grandes (ex.: o interpretador JS de 11 MB). O Cranelift em
# opt-level 0 leva ~100 s para isso; otimizado, segundos. Só afeta builds de desenvolvimento.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-native]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3

# Fuzz por mutação faz dezenas de milhares de verificações de assinatura: cripto otimizada.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
