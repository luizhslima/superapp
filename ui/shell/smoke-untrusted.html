<!doctype html>
<html><head><meta charset="utf-8"><title>untrusted</title></head>
<body>
  <script src="ipc.js"></script>
  <script>
    (async () => {
      const bc = new BroadcastChannel("smoke");
      await new Promise((r) => setTimeout(r, 1500));
      const info = await window.host("app.info");
      const echo = await window.host("app.echo", { text: "x" });
      const bytes = await window.hostBytes("blob.echo", new Uint8Array([1]));
      const blob = await window.hostBlob("blob.echo", new Uint8Array([1]));
      const apps = await window.host("apps.list");
      const appsRun = await window.host("apps.dispatch", { id: "clicker", event: { type: "init" } });
      const upd = await window.host("app.update.check");
      const updInstall = await window.host("app.update.install");
      const diag = await window.host("diag.report");
      const storeCat = await window.host("store.catalog");
      const storeDl = await window.host("store.download", { id: "clicker" });
      const trustList = await window.host("trust.list");
      const trustAdd = await window.host("trust.add", { key: "ab".repeat(32) });
      const trustRm = await window.host("trust.remove", { key: "ab".repeat(32) });
      const dataExp = await window.host("data.export", { id: "clicker" });
      const dataImp = await window.host("data.import", { id: "clicker" });
      const appsPick = await window.host("apps.pick");
      const restart = await window.host("app.restart");
      const quit = await window.host("app.quit");
      const menuPopup = await window.host("menu.popup");
      const viewDispatch = await window.host("view.dispatch", { event: { type: "init" } });
      const appsOpen = await window.host("apps.open", { id: "clicker" });
      bc.postMessage({
        info, echo, bytes, blob, apps, appsRun, upd, updInstall, diag, storeCat, storeDl,
        trustList, trustAdd, trustRm, dataExp, dataImp, appsPick, restart, quit, menuPopup, viewDispatch, appsOpen,
      });
    })();
  </script>
</body></html>
