<!doctype html>
<html><head><meta charset="utf-8"><title>untrusted</title></head>
<body>
  <script src="ipc.js"></script>
  <script>
    (async () => {
      const bc = new BroadcastChannel("smoke");
      await new Promise((r) => setTimeout(r, 1500));
      const info = await window.host("app.info");
      const echo = await window.host("app.echo", { text: "x" });
      const bytes = await window.hostBytes("blob.echo", new Uint8Array([1]));
      const blob = await window.hostBlob("blob.echo", new Uint8Array([1]));
      const apps = await window.host("apps.list");
      const appsRun = await window.host("apps.dispatch", { id: "clicker", event: { type: "init" } });
      const upd = await window.host("app.update.check");
      const updInstall = await window.host("app.update.install");
      const diag = await window.host("diag.report");
      const storeCat = await window.host("store.catalog");
      const storeDl = await window.host("store.download", { id: "clicker" });
      bc.postMessage({ info, echo, bytes, blob, apps, appsRun, upd, updInstall, diag, storeCat, storeDl });
    })();
  </script>
</body></html>
