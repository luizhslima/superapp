[package]
name = "superapp"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "superapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
superapp-core = { path = "../crates/core" }
superapp-package = { path = "../crates/package" }
superapp-wasm-host = { path = "../crates/wasm-host" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["isolation"] }
tauri-plugin-updater = "2"
# Rede só para o catálogo/baixa de mini-apps (store.rs). Mesmo TLS do updater: rustls + ring.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
