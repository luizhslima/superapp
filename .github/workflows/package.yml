name: package

# Instaladores sem assinatura (custo zero): Windows NSIS, Linux deb/AppImage, macOS dmg.
# Roda sob demanda e em tags v*. Também publica o benchmark de release no resumo do run.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark de release
        if: runner.os != 'Linux'
        run: cargo xtask bench
      - name: Benchmark de release (Linux, xvfb)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: xvfb-run -a cargo xtask bench
      - name: Instaladores
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
      - name: Tamanho dos instaladores
        shell: bash
        run: |
          echo "### Instaladores (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find target/release/bundle -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) -exec ls -l {} \; | awk '{printf "%.1f MB  %s\n", $5/1048576, $NF}' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: superapp-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  # SBOM (CycloneDX) das dependencias Rust, publicado como artefato de cada execucao.
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - run: cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: "**/*.cdx.json"
          if-no-files-found: error
          retention-days: 90
