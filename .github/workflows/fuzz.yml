name: fuzz

# Fuzz guiado por cobertura (libFuzzer) dos parsers de entrada não confiável. Precisa de
# nightly, então fica fora da CI principal: semanal e sob demanda.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Segundos por alvo"
        default: "60"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [package_verify, manifest_json, ui_parse, router_dispatch]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Instalar cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz (${{ matrix.target }})
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ github.event.inputs.seconds || '60' }}
      - name: Guardar casos que quebraram
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
